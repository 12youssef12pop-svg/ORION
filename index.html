<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#03070b] text-slate-100 flex flex-col min-h-screen">

    <!-- Header Section -->
    <header class="w-full bg-[#06111a]/90 backdrop-blur-md border-b border-cyan-900/40 py-5 px-6 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-600 via-teal-500 to-cyan-300 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid font-bold text-2xl text-slate-950">☪</i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-200 to-cyan-100 logo-glow">ORION</h1>
            </div>
            
            <div class="text-center md:text-right">
                <p class="text-emerald-400 text-sm md:text-base font-semibold flex items-center justify-center md:justify-end gap-2">
                    <span>هنا ستجد كل إجاباتك إن شاء الله</span>
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                </p>
                <p class="text-slate-400 text-xs md:text-sm mt-0.5">
                    إجابات موثوقة ومبسطة على أسئلتك الدينية وفق كتاب الله وسنة رسوله ﷺ
                </p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 flex flex-col items-center justify-center gap-8">
        
        <!-- Quranic Verse Display Card -->
        <div class="w-full relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-amber-500/20 via-yellow-400/30 to-amber-500/20 rounded-2xl blur opacity-75 group-hover:opacity-100 transition duration-1000"></div>
            
            <div class="relative w-full rounded-2xl bg-[#081724]/90 border-2 border-amber-500/50 p-6 md:p-8 text-center shadow-2xl backdrop-blur-xl">
                <!-- Header of Card -->
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-amber-500/20 text-amber-400/80 text-xs md:text-sm">
                    <span class="flex items-center gap-1.5">
                        <i class="fa-solid fa-book-quran"></i> آية قرآنية كريمة
                    </span>
                    
                    <div class="flex items-center gap-3">
                        <button id="toggleTimerBtn" class="hover:text-amber-300 transition-colors" title="إيقاف/تشغيل التبديل التلقائي">
                            <i id="timerIcon" class="fa-solid fa-pause"></i>
                        </button>
                        <button id="nextAyahBtn" class="hover:text-amber-300 transition-colors" title="الآية التالية">
                            <i class="fa-solid fa-rotate"></i>
                        </button>
                    </div>
                </div>

                <!-- Verse Content -->
                <div class="min-h-[140px] flex flex-col items-center justify-center px-2">
                    <p id="quranText" class="quran-text text-2xl md:text-4xl text-amber-100 leading-relaxed font-bold mb-3 transition-opacity duration-500">
                        "إِنَّ مَعَ الْعُسْرِ يُسْرًا"
                    </p>
                    <p id="quranRef" class="text-amber-400/90 text-sm md:text-base font-semibold transition-opacity duration-500">
                        [سورة الشرح: 6]
                    </p>
                </div>

                <!-- Audio Controls & Progress Bar -->
                <div class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-amber-500/20">
                    <button id="playAudioBtn" class="flex items-center gap-2 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/40 px-4 py-2 rounded-xl text-xs md:text-sm transition-all duration-300">
                        <i id="audioIcon" class="fa-solid fa-volume-high"></i>
                        <span id="audioStatus">استمع للآية بصوت الشيخ العفاسي</span>
                    </button>
                    
                    <div class="flex items-center gap-2 text-xs text-slate-400">
                        <span>تتغير خلال 10 ثوانٍ</span>
                        <div class="w-20 bg-slate-800 rounded-full h-1.5 overflow-hidden border border-amber-500/30">
                            <div id="progressBar" class="bg-amber-400 h-full w-full transition-all duration-100 ease-linear"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search / Question Input Section -->
        <div class="w-full flex flex-col gap-3">
            <form id="searchForm" class="relative w-full">
                <input 
                    type="text" 
                    id="searchInput"
                    placeholder="اكتب سؤالك هنا..." 
                    class="w-full bg-[#081827] border-2 border-cyan-800/60 focus:border-cyan-400 text-slate-100 text-base md:text-lg rounded-2xl py-4 pr-5 pl-14 outline-none shadow-lg focus:shadow-cyan-500/20 transition-all duration-300"
                    required
                >
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold flex items-center justify-center transition-all duration-300 shadow-md hover:scale-105"
                >
                    <i class="fa-solid fa-arrow-up text-lg"></i>
                </button>
            </form>

            <!-- Suggested / Famous Questions -->
            <div class="w-full px-2">
                <h3 class="text-slate-400 text-sm font-semibold mb-3 flex items-center gap-2">
                    <span>الأسئلة المشهورة</span>
                    <span class="text-cyan-500">••</span>
                </h3>
                <div class="flex flex-wrap gap-2" id="popularQuestions">
                    <button class="q-btn bg-[#0c2135] hover:bg-cyan-950 text-slate-300 hover:text-cyan-200 border border-cyan-900/50 px-4 py-2 rounded-xl text-xs md:text-sm transition-all duration-200">
                        ما هي أركان الإسلام؟
                    </button>
                    <button class="q-btn bg-[#0c2135] hover:bg-cyan-950 text-slate-300 hover:text-cyan-200 border border-cyan-900/50 px-4 py-2 rounded-xl text-xs md:text-sm transition-all duration-200">
                        كيف أدعو في قيام الليل؟
                    </button>
                    <button class="q-btn bg-[#0c2135] hover:bg-cyan-950 text-slate-300 hover:text-cyan-200 border border-cyan-900/50 px-4 py-2 rounded-xl text-xs md:text-sm transition-all duration-200">
                        ما فضل قراءة سورة الكهف يوم الجمعة؟
                    </button>
                    <button class="q-btn bg-[#0c2135] hover:bg-cyan-950 text-slate-300 hover:text-cyan-200 border border-cyan-900/50 px-4 py-2 rounded-xl text-xs md:text-sm transition-all duration-200">
                        أذكار الصباح والمساء الصحيحة
                    </button>
                </div>
            </div>
        </div>

        <!-- Answer Container -->
        <div id="answerCard" class="w-full hidden transition-all duration-500">
            <div class="w-full bg-[#081827] border border-cyan-700/50 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-2 h-full bg-cyan-400"></div>
                <h4 class="text-cyan-400 font-bold text-lg mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-kaaba"></i> الإجابة الشاملة والمبسطة:
                </h4>
                <div id="answerContent" class="text-slate-200 text-sm md:text-base leading-relaxed space-y-3">
                    <!-- Dynamic Output -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-slate-500 text-xs border-t border-slate-900 mt-auto">
        جميع الحقوق محفوظة منصة ORION © 2026
    </footer>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
